version: '3'
services:
  backend-app:
    build: ./backend-app
    container_name: santino_backend_app
    ports:
      - "8081:8081"
    volumes:
      - ./backend-app/uploads:/app/uploads
      - ./backend-app/samples:/app/samples
      - ./env.js:/app/env.js
    environment:
      # host.docker.internal cho phép container truy cập host machine (Docker Desktop Windows/Mac)
      - ONLYOFFICE_URL=http://host.docker.internal:8084
      # URL để OnlyOffice tải file .docx (host.docker.internal resolves host machine từ trong container)
      - BACKEND_INTERNAL_URL=http://host.docker.internal:8081
    restart: always

  onlyoffice:
    image: onlyoffice/documentserver:latest
    container_name: santino_onlyoffice_server
    ports:
      - "8084:80"
    volumes:
      # Config: tắt JWT + cho phép private IP download
      - ./onlyoffice-local.json:/etc/onlyoffice/documentserver/local.json
    environment:
      # Tắt JWT để không bị lỗi chặn Token khi kết nối
      - JWT_ENABLED=false
    restart: always
